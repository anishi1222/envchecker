name: Dependency Submission (Maven)

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  submit-maven:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up GraalVM Java 25
        uses: actions/setup-java@v6
        with:
          distribution: 'graalvm'
          java-version: '25'

      - name: Verify Maven uses Java 25+
        run: |
          MVN_VERSION="$(mvn --version)"
          echo "$MVN_VERSION"
          MAVEN_JAVA_MAJOR="$(printf '%s\n' "$MVN_VERSION" | sed -n 's/^Java version: \([0-9][0-9]*\).*/\1/p')"
          if [ -z "$MAVEN_JAVA_MAJOR" ] || [ "$MAVEN_JAVA_MAJOR" -lt 25 ]; then
            echo "Maven dependency submission requires Java 25+; mvn --version reported Java ${MAVEN_JAVA_MAJOR:-unknown}." >&2
            exit 1
          fi

      - name: Generate and submit dependency graph
        uses: advanced-security/maven-dependency-submission-action@v5
